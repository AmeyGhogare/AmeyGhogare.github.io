<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18" />
      <stop offset="50%" stop-color="#0b1728" />
      <stop offset="100%" stop-color="#030812" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.0" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridPattern3" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad3)" />
  <rect width="800" height="480" fill="url(#gridPattern3)" />
  <circle cx="200" cy="180" r="160" fill="#10b981" opacity="0.08" filter="url(#glow3)" />
  <circle cx="640" cy="280" r="170" fill="#00f2fe" opacity="0.08" filter="url(#glow3)" />

  <!-- Top Navigation Header -->
  <rect x="40" y="30" width="720" height="44" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
  <rect x="56" y="42" width="20" height="20" rx="4" fill="#10b981" />
  <text x="66" y="56" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" text-anchor="middle">₹</text>
  <text x="88" y="57" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">ATM CASH UTILIZATION &amp; AVAILABILITY RISK ANALYTICS</text>
  <rect x="530" y="40" width="105" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="582" y="56" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">EDA &bull; DAX &bull; SQL</text>
  <rect x="645" y="40" width="100" height="24" rx="6" fill="#059669" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
  <text x="695" y="56" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">98.2% UPTIME</text>

  <!-- Left Side: Cash Demand Time Series Curve -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="450" height="225" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5" />
    <text x="24" y="32" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">HOURLY CASH WITHDRAWAL &amp; DEMAND PATTERNS</text>
    <text x="24" y="48" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">Peak hours: 11:00 AM – 1:00 PM &bull; 6:00 PM – 9:00 PM</text>

    <!-- Graph Axis and Lines -->
    <g transform="translate(30, 70)">
      <!-- Grid lines -->
      <line x1="0" y1="20" x2="390" y2="20" stroke="#1e293b" stroke-dasharray="3 3" />
      <line x1="0" y1="60" x2="390" y2="60" stroke="#1e293b" stroke-dasharray="3 3" />
      <line x1="0" y1="100" x2="390" y2="100" stroke="#1e293b" stroke-dasharray="3 3" />

      <!-- Area fill -->
      <path d="M 0 110 L 30 95 L 60 100 L 90 70 L 120 40 L 150 50 L 180 80 L 210 65 L 240 25 L 270 35 L 300 70 L 330 90 L 360 85 L 390 100 L 390 120 L 0 120 Z" fill="url(#chartFill)" />
      <!-- Spline Curve -->
      <path d="M 0 110 Q 45 80, 90 70 T 150 50 T 210 65 T 270 35 T 330 90 T 390 100" fill="none" stroke="#00f2fe" stroke-width="2.5" />
      
      <!-- Key Threshold Line -->
      <line x1="0" y1="45" x2="390" y2="45" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 4" />
      <text x="390" y="42" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">RISK THRESHOLD (CASH-OUT WARNING)</text>

      <!-- Data nodes -->
      <circle cx="120" cy="40" r="4" fill="#00f2fe" filter="url(#glow3)" />
      <circle cx="240" cy="25" r="4" fill="#f59e0b" filter="url(#glow3)" />
    </g>

    <!-- Bottom summary row -->
    <rect x="0" y="240" width="450" height="100" rx="14" fill="#020617" fill-opacity="0.9" stroke="#1e293b" stroke-width="1" />
    <g transform="translate(20, 255)">
      <text x="0" y="16" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">DAX MEASURE</text>
      <text x="0" y="38" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">Avg_Utilization = DIVIDE([Total_Dispensed], [Initial_Float], 0)</text>
      <text x="0" y="58" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">Cash_Out_Risk = IF([Remaining_Cash] &lt; 0.15 * [Capacity], "HIGH", "NORMAL")</text>
    </g>
  </g>

  <!-- Right Side: Risk & Downtime Breakdown -->
  <g transform="translate(510, 95)">
    <!-- Downtime Metric Card -->
    <rect x="0" y="0" width="250" height="105" rx="14" fill="#111827" fill-opacity="0.9" stroke="#1e293b" stroke-width="1" />
    <text x="18" y="26" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1">DOWNTIME REDUCTION</text>
    <text x="18" y="66" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800">-34.2%</text>
    <text x="18" y="88" fill="#10b981" font-family="'Inter', sans-serif" font-size="11">&bull; Proactive Replenishment Scheduling</text>

    <!-- Cash Availability Risk -->
    <rect x="0" y="120" width="250" height="105" rx="14" fill="#111827" fill-opacity="0.9" stroke="#1e293b" stroke-width="1" />
    <text x="18" y="146" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1">CASH AVAILABILITY RATE</text>
    <text x="18" y="186" fill="#00f2fe" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800">99.1%</text>
    <text x="18" y="208" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">&bull; Optimized replenishment cycles</text>

    <!-- Cluster / Terminal status -->
    <rect x="0" y="240" width="250" height="100" rx="14" fill="#111827" fill-opacity="0.9" stroke="#1e293b" stroke-width="1" />
    <text x="18" y="264" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1">ANALYTICS ENGINE</text>
    <g transform="translate(18, 276)">
      <rect x="0" y="5" width="65" height="44" rx="6" fill="#1e293b" />
      <text x="32" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">Pandas</text>
      <text x="32" y="38" fill="#64748b" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Cleaning</text>

      <rect x="74" y="5" width="65" height="44" rx="6" fill="#1e293b" />
      <text x="106" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">MySQL</text>
      <text x="106" y="38" fill="#64748b" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Querying</text>

      <rect x="148" y="5" width="65" height="44" rx="6" fill="#1e293b" />
      <text x="180" y="24" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">PowerBI</text>
      <text x="180" y="38" fill="#64748b" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Dashboard</text>
    </g>
  </g>
</svg>
