<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridPattern1" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad1)" />
  <rect width="800" height="480" fill="url(#gridPattern1)" />
  <circle cx="200" cy="180" r="160" fill="#00f2fe" opacity="0.08" filter="url(#glow1)" />
  <circle cx="620" cy="300" r="180" fill="#8b5cf6" opacity="0.08" filter="url(#glow1)" />

  <!-- Top Status Bar -->
  <rect x="40" y="30" width="720" height="42" rx="10" fill="#111827" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
  <circle cx="65" cy="51" r="5" fill="#ef4444" />
  <circle cx="85" cy="51" r="5" fill="#f59e0b" />
  <circle cx="105" cy="51" r="5" fill="#10b981" />
  <text x="135" y="56" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">LIVE WEBCAM STREAM &bull; OPENCV &bull; MEDIAPIPE FACIAL MESH</text>
  <rect x="630" y="40" width="115" height="22" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
  <circle cx="645" cy="51" r="3.5" fill="#22c55e" filter="url(#glow1)" />
  <text x="657" y="55" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">STATUS: ACTIVE</text>

  <!-- Main Central HUD (Face Landmark & Tracking Visualization) -->
  <g transform="translate(60, 100)">
    <!-- Video Feed Container -->
    <rect x="0" y="0" width="400" height="330" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" />
    
    <!-- Target HUD Brackets -->
    <path d="M 40 40 L 20 40 L 20 60" fill="none" stroke="#00f2fe" stroke-width="3" />
    <path d="M 360 40 L 380 40 L 380 60" fill="none" stroke="#00f2fe" stroke-width="3" />
    <path d="M 40 290 L 20 290 L 20 270" fill="none" stroke="#00f2fe" stroke-width="3" />
    <path d="M 360 290 L 380 290 L 380 270" fill="none" stroke="#00f2fe" stroke-width="3" />

    <!-- Stylized Face Landmark Mesh -->
    <ellipse cx="200" cy="155" rx="80" ry="105" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
    <!-- Facial mesh lines -->
    <path d="M 150 130 Q 200 120 250 130" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.7" />
    <!-- Eye Left -->
    <ellipse cx="165" cy="140" rx="18" ry="10" fill="#0284c7" fill-opacity="0.2" stroke="#00f2fe" stroke-width="2" />
    <circle cx="165" cy="140" r="4" fill="#00f2fe" />
    <!-- Eye Right -->
    <ellipse cx="235" cy="140" rx="18" ry="10" fill="#0284c7" fill-opacity="0.2" stroke="#00f2fe" stroke-width="2" />
    <circle cx="235" cy="140" r="4" fill="#00f2fe" />
    <!-- Nose bridge & tip -->
    <path d="M 200 135 L 200 180 L 190 190 L 210 190 Z" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
    <!-- Mouth -->
    <path d="M 175 215 Q 200 230 225 215" fill="none" stroke="#8b5cf6" stroke-width="2" />
    <!-- Landmark nodes -->
    <circle cx="165" cy="140" r="2.5" fill="#38bdf8" filter="url(#glow1)" />
    <circle cx="235" cy="140" r="2.5" fill="#38bdf8" filter="url(#glow1)" />
    <circle cx="200" cy="190" r="2.5" fill="#00f2fe" />
    <circle cx="200" cy="100" r="2.5" fill="#8b5cf6" />
    <circle cx="140" cy="170" r="2" fill="#38bdf8" />
    <circle cx="260" cy="170" r="2" fill="#38bdf8" />

    <!-- Overlay Telemetry Tag -->
    <rect x="25" y="275" width="220" height="34" rx="8" fill="#020617" fill-opacity="0.9" stroke="#1e293b" />
    <text x="35" y="292" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">PITCH: 2.4° &bull; YAW: -1.1° &bull; ROLL: 0.8°</text>
    <text x="35" y="303" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">HEAD POSE: ALIGNED</text>
  </g>

  <!-- Right Side Analytics Panel -->
  <g transform="translate(480, 100)">
    <!-- Metric Card 1: Attention State -->
    <rect x="0" y="0" width="280" height="98" rx="14" fill="#111827" fill-opacity="0.9" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="28" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1">ATTENTION STATE</text>
    <rect x="180" y="14" width="85" height="20" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
    <text x="222" y="27" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">OPTIMAL</text>
    <text x="20" y="65" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800">96.4%</text>
    <text x="110" y="65" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12">Focused Score</text>
    <!-- Progress mini-bar -->
    <rect x="20" y="78" width="240" height="6" rx="3" fill="#1e293b" />
    <rect x="20" y="78" width="231" height="6" rx="3" fill="url(#cyanBlueGrad)" />

    <!-- Metric Card 2: Eye Aspect Ratio (EAR) -->
    <rect x="0" y="114" width="280" height="98" rx="14" fill="#111827" fill-opacity="0.9" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="142" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1">EAR BLINK METRIC</text>
    <rect x="180" y="128" width="85" height="20" rx="10" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1" />
    <text x="222" y="141" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">0.34 EAR</text>
    <text x="20" y="179" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="26" font-weight="800">14 / min</text>
    <text x="125" y="179" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Blink Rate</text>
    <!-- Sparkline -->
    <path d="M 20 198 L 60 195 L 90 202 L 120 192 L 150 190 L 180 204 L 210 191 L 240 193 L 260 190" fill="none" stroke="#8b5cf6" stroke-width="2" />

    <!-- Metric Card 3: Session Tracking Summary -->
    <rect x="0" y="228" width="280" height="102" rx="14" fill="#111827" fill-opacity="0.9" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="254" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1">SESSION TELEMETRY</text>
    <g transform="translate(20, 268)">
      <rect x="0" y="0" width="70" height="46" rx="8" fill="#1e293b" fill-opacity="0.6" />
      <text x="35" y="20" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">48m</text>
      <text x="35" y="36" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Duration</text>

      <rect x="85" y="0" width="70" height="46" rx="8" fill="#1e293b" fill-opacity="0.6" />
      <text x="120" y="20" fill="#22c55e" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">0</text>
      <text x="120" y="36" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Drowsy</text>

      <rect x="170" y="0" width="70" height="46" rx="8" fill="#1e293b" fill-opacity="0.6" />
      <text x="205" y="20" fill="#8b5cf6" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">Flask</text>
      <text x="205" y="36" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Backend</text>
    </g>
  </g>
</svg>
