<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e1a" />
      <stop offset="50%" stop-color="#11162b" />
      <stop offset="100%" stop-color="#050711" />
    </linearGradient>
    <linearGradient id="rosePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridPattern4" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad4)" />
  <rect width="800" height="480" fill="url(#gridPattern4)" />
  <circle cx="220" cy="180" r="160" fill="#8b5cf6" opacity="0.08" filter="url(#glow4)" />
  <circle cx="620" cy="300" r="170" fill="#f43f5e" opacity="0.08" filter="url(#glow4)" />

  <!-- Top Navigation Header -->
  <rect x="40" y="30" width="720" height="44" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
  <rect x="56" y="42" width="20" height="20" rx="4" fill="#8b5cf6" />
  <text x="66" y="56" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" text-anchor="middle">ML</text>
  <text x="88" y="57" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">CUSTOMER CHURN PREDICTION &amp; RETENTION INTELLIGENCE</text>
  <rect x="545" y="40" width="95" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="592" y="56" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">SCIKIT-LEARN</text>
  <rect x="650" y="40" width="95" height="24" rx="6" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1" />
  <text x="697" y="56" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">CLASSIFIER</text>

  <!-- Left: Feature Importance & Pipeline -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="440" height="225" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5" />
    <text x="24" y="32" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">KEY CHURN PREDICTORS (FEATURE IMPORTANCE)</text>
    <text x="24" y="48" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">Identifies high-risk customer segments prior to service cancellation</text>

    <!-- Horizontal Bars for Features -->
    <g transform="translate(24, 70)">
      <!-- Feature 1 -->
      <text x="0" y="14" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Contract Type (Month-to-Month)</text>
      <text x="390" y="14" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">0.38</text>
      <rect x="0" y="20" width="390" height="8" rx="4" fill="#1e293b" />
      <rect x="0" y="20" width="290" height="8" rx="4" fill="url(#rosePurple)" />

      <!-- Feature 2 -->
      <text x="0" y="46" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Customer Tenure (Months)</text>
      <text x="390" y="46" fill="#8b5cf6" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">0.26</text>
      <rect x="0" y="52" width="390" height="8" rx="4" fill="#1e293b" />
      <rect x="0" y="52" width="210" height="8" rx="4" fill="#8b5cf6" />

      <!-- Feature 3 -->
      <text x="0" y="78" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Monthly Charges Amount</text>
      <text x="390" y="78" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">0.19</text>
      <rect x="0" y="84" width="390" height="8" rx="4" fill="#1e293b" />
      <rect x="0" y="84" width="150" height="8" rx="4" fill="#38bdf8" />

      <!-- Feature 4 -->
      <text x="0" y="110" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Tech Support &amp; Online Security</text>
      <text x="390" y="110" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="end">0.12</text>
      <rect x="0" y="116" width="390" height="8" rx="4" fill="#1e293b" />
      <rect x="0" y="116" width="95" height="8" rx="4" fill="#10b981" />
    </g>

    <!-- Bottom ML Pipeline Stage -->
    <rect x="0" y="240" width="440" height="100" rx="14" fill="#020617" fill-opacity="0.95" stroke="#1e293b" stroke-width="1" />
    <g transform="translate(20, 256)">
      <text x="0" y="15" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10"># SCIKIT-LEARN PIPELINE WORKFLOW</text>
      <text x="0" y="38" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">pipeline = Pipeline([('scaler', StandardScaler()),</text>
      <text x="0" y="58" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11">                     ('classifier', RandomForestClassifier())])</text>
    </g>
  </g>

  <!-- Right: Churn Risk Gauge & Evaluation -->
  <g transform="translate(500, 95)">
    <!-- Risk Meter Card -->
    <rect x="0" y="0" width="260" height="155" rx="14" fill="#111827" fill-opacity="0.9" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="28" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1">CHURN PROBABILITY SCORE</text>
    
    <!-- Semi-circular dial -->
    <g transform="translate(130, 95)">
      <path d="M -70 0 A 70 70 0 0 1 70 0" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round" />
      <path d="M -70 0 A 70 70 0 0 1 45 -54" fill="none" stroke="url(#rosePurple)" stroke-width="14" stroke-linecap="round" />
      <circle cx="0" cy="0" r="6" fill="#f8fafc" />
      <line x1="0" y1="0" x2="35" y2="-42" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
      <text x="0" y="-12" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" text-anchor="middle">78.5%</text>
      <text x="0" y="25" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">AT-RISK PROFILE</text>
    </g>

    <!-- Model Evaluation Summary Card -->
    <rect x="0" y="170" width="260" height="170" rx="14" fill="#111827" fill-opacity="0.9" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="196" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1">MODEL EVALUATION METRICS</text>

    <g transform="translate(20, 215)">
      <rect x="0" y="0" width="105" height="44" rx="8" fill="#1e293b" />
      <text x="52" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">0.86</text>
      <text x="52" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">ROC-AUC</text>

      <rect x="115" y="0" width="105" height="44" rx="8" fill="#1e293b" />
      <text x="167" y="18" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">0.84</text>
      <text x="167" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Precision</text>

      <rect x="0" y="54" width="105" height="44" rx="8" fill="#1e293b" />
      <text x="52" y="72" fill="#8b5cf6" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">0.82</text>
      <text x="52" y="86" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Recall</text>

      <rect x="115" y="54" width="105" height="44" rx="8" fill="#1e293b" />
      <text x="167" y="72" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">0.83</text>
      <text x="167" y="86" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">F1-Score</text>
    </g>
  </g>
</svg>
