<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="heroCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98" />
    </linearGradient>
    <linearGradient id="heroGradientBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGlowHero" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="heroFilterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Main Card -->
  <circle cx="300" cy="250" r="180" fill="#38bdf8" opacity="0.12" filter="url(#heroFilterGlow)" />
  <circle cx="420" cy="180" r="140" fill="#8b5cf6" opacity="0.14" filter="url(#heroFilterGlow)" />

  <!-- Outer Glass Frame -->
  <rect x="30" y="30" width="540" height="440" rx="24" fill="url(#heroCardBg)" stroke="url(#heroGradientBorder)" stroke-width="1.8" />

  <!-- Terminal Window Header -->
  <g transform="translate(54, 54)">
    <circle cx="8" cy="8" r="6" fill="#ef4444" fill-opacity="0.9" />
    <circle cx="28" cy="8" r="6" fill="#f59e0b" fill-opacity="0.9" />
    <circle cx="48" cy="8" r="6" fill="#10b981" fill-opacity="0.9" />
    <text x="74" y="12" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">amey@analytics-core: ~ (python3.10)</text>

    <rect x="360" y="-2" width="126" height="20" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
    <circle cx="372" cy="8" r="3" fill="#22c55e" filter="url(#heroFilterGlow)" />
    <text x="382" y="11" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700">PIPELINE: ONLINE</text>
  </g>

  <!-- Code / Data Stream Preview Section -->
  <g transform="translate(54, 98)">
    <rect x="0" y="0" width="492" height="152" rx="14" fill="#030712" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
    
    <text x="20" y="28" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">01</text>
    <text x="48" y="28" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11">import</text>
    <text x="96" y="28" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">pandas</text>
    <text x="144" y="28" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11">as</text>
    <text x="165" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">pd,</text>
    <text x="195" y="28" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">numpy</text>
    <text x="240" y="28" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11">as</text>
    <text x="260" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">np</text>

    <text x="20" y="52" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">02</text>
    <text x="48" y="52" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11">from</text>
    <text x="82" y="52" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">sklearn.ensemble</text>
    <text x="208" y="52" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11">import</text>
    <text x="258" y="52" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11">RandomForestClassifier</text>

    <text x="20" y="76" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">03</text>
    <text x="48" y="76" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11">import</text>
    <text x="96" y="76" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">cv2,</text>
    <text x="130" y="76" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">mediapipe</text>
    <text x="204" y="76" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="11">as</text>
    <text x="224" y="76" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">mp</text>

    <text x="20" y="102" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">04</text>
    <text x="48" y="102" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11"># Transforming raw data into predictive intelligence</text>

    <text x="20" y="128" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">05</text>
    <text x="48" y="128" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">insights</text>
    <text x="110" y="128" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="11">=</text>
    <text x="126" y="128" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="11">pipeline.fit_predict(real_world_data)</text>
    <rect x="408" y="117" width="8" height="14" fill="#00f2fe" opacity="0.8" />
  </g>

  <!-- Interactive Telemetry Grid Row -->
  <g transform="translate(54, 272)">
    <!-- Metric 1: Clean Data EDA -->
    <rect x="0" y="0" width="150" height="92" rx="12" fill="#111827" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">ANALYTICS ENGINE</text>
    <text x="16" y="55" fill="#38bdf8" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">100K+</text>
    <text x="16" y="74" fill="#64748b" font-family="'Inter', sans-serif" font-size="9.5">Data Points Cleaned</text>

    <!-- Metric 2: Computer Vision & ML -->
    <rect x="171" y="0" width="150" height="92" rx="12" fill="#111827" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">ML ACCURACY</text>
    <text x="16" y="55" fill="#a855f7" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">0.86 AUC</text>
    <text x="16" y="74" fill="#64748b" font-family="'Inter', sans-serif" font-size="9.5">Model Performance</text>

    <!-- Metric 3: Real-Time CV -->
    <rect x="342" y="0" width="150" height="92" rx="12" fill="#111827" fill-opacity="0.8" stroke="#1e293b" stroke-width="1" />
    <text x="16" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">CV LATENCY</text>
    <text x="16" y="55" fill="#10b981" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">&lt; 30ms</text>
    <text x="16" y="74" fill="#64748b" font-family="'Inter', sans-serif" font-size="9.5">Landmark Tracking</text>
  </g>

  <!-- Bottom Interactive Badges Row -->
  <g transform="translate(54, 386)">
    <rect x="0" y="0" width="492" height="42" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <g transform="translate(16, 26)">
      <circle cx="6" cy="-4" r="4" fill="#00f2fe" />
      <text x="16" y="0" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Python</text>
      
      <circle cx="82" cy="-4" r="4" fill="#38bdf8" />
      <text x="92" y="0" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" font-weight="500">SQL</text>

      <circle cx="140" cy="-4" r="4" fill="#f59e0b" />
      <text x="150" y="0" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Power BI</text>

      <circle cx="225" cy="-4" r="4" fill="#8b5cf6" />
      <text x="235" y="0" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Scikit-learn</text>

      <circle cx="325" cy="-4" r="4" fill="#10b981" />
      <text x="335" y="0" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Flask / OpenCV</text>
    </g>
  </g>
</svg>
