<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a" />
      <stop offset="50%" stop-color="#0b1528" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="blueGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridPattern2" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="480" fill="url(#bgGrad2)" />
  <rect width="800" height="480" fill="url(#gridPattern2)" />
  <circle cx="220" cy="160" r="150" fill="#f59e0b" opacity="0.07" filter="url(#glow2)" />
  <circle cx="600" cy="320" r="180" fill="#0284c7" opacity="0.08" filter="url(#glow2)" />

  <!-- Top App Navigation Bar -->
  <rect x="40" y="30" width="720" height="44" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
  <rect x="55" y="42" width="20" height="20" rx="4" fill="#f59e0b" />
  <text x="65" y="56" fill="#0f172a" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" text-anchor="middle">O</text>
  <text x="86" y="57" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">OLA CAB BOOKINGS &bull; BI ANALYTICS SUITE</text>
  <rect x="520" y="40" width="105" height="24" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
  <text x="572" y="56" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">SQL + POWER BI</text>
  <rect x="635" y="40" width="110" height="24" rx="6" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
  <text x="690" y="56" fill="#00f2fe" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">LIVE FILTERS</text>

  <!-- Left: Revenue & Booking KPIs -->
  <g transform="translate(40, 95)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="220" height="96" rx="12" fill="#111827" fill-opacity="0.9" stroke="#1e293b" stroke-width="1" />
    <text x="18" y="26" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1">TOTAL BOOKINGS</text>
    <text x="18" y="62" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800">100K+</text>
    <text x="18" y="82" fill="#22c55e" font-family="'Inter', sans-serif" font-size="11">&uarr; 14.8% vs Prev Period</text>

    <!-- KPI 2 -->
    <rect x="0" y="110" width="220" height="96" rx="12" fill="#111827" fill-opacity="0.9" stroke="#1e293b" stroke-width="1" />
    <text x="18" y="136" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1">CANCELLATION RATE</text>
    <text x="18" y="172" fill="#ef4444" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800">22.4%</text>
    <text x="18" y="192" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Customer &amp; Driver Splits</text>

    <!-- KPI 3 -->
    <rect x="0" y="220" width="220" height="120" rx="12" fill="#111827" fill-opacity="0.9" stroke="#1e293b" stroke-width="1" />
    <text x="18" y="246" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="1">PAYMENT MODES</text>
    <!-- Mini breakdown bars -->
    <g transform="translate(18, 260)">
      <text x="0" y="10" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">UPI / Digital</text>
      <text x="184" y="10" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">56%</text>
      <rect x="0" y="16" width="184" height="6" rx="3" fill="#1e293b" />
      <rect x="0" y="16" width="103" height="6" rx="3" fill="#38bdf8" />

      <text x="0" y="38" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Cash</text>
      <text x="184" y="38" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">32%</text>
      <rect x="0" y="44" width="184" height="6" rx="3" fill="#1e293b" />
      <rect x="0" y="44" width="59" height="6" rx="3" fill="#f59e0b" />

      <text x="0" y="66" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Credit / Debit</text>
      <text x="184" y="66" fill="#8b5cf6" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="end">12%</text>
      <rect x="0" y="72" width="184" height="6" rx="3" fill="#1e293b" />
      <rect x="0" y="72" width="22" height="6" rx="3" fill="#8b5cf6" />
    </g>
  </g>

  <!-- Right: Power BI Visual Dashboard & SQL Snippet -->
  <g transform="translate(280, 95)">
    <!-- Main Interactive Chart Card -->
    <rect x="0" y="0" width="480" height="216" rx="14" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5" />
    <text x="24" y="32" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">RIDE VOLUME &amp; REVENUE BY VEHICLE TYPE</text>
    <text x="24" y="48" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">Prime Sedan &bull; Mini &bull; Auto &bull; Bike &bull; Prime SUV</text>

    <!-- Bar Chart Visuals -->
    <g transform="translate(30, 80)">
      <!-- Prime Sedan -->
      <text x="30" y="112" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Sedan</text>
      <rect x="15" y="10" width="30" height="85" rx="5" fill="url(#blueGlowGrad)" />
      
      <!-- Mini -->
      <text x="110" y="112" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Mini</text>
      <rect x="95" y="0" width="30" height="95" rx="5" fill="#38bdf8" />
      
      <!-- Auto -->
      <text x="190" y="112" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Auto</text>
      <rect x="175" y="25" width="30" height="70" rx="5" fill="#f59e0b" />
      
      <!-- Bike -->
      <text x="270" y="112" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Bike</text>
      <rect x="255" y="45" width="30" height="50" rx="5" fill="#10b981" />

      <!-- Prime SUV -->
      <text x="350" y="112" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">SUV</text>
      <rect x="335" y="35" width="30" height="60" rx="5" fill="#8b5cf6" />
    </g>

    <!-- SQL Code Card -->
    <rect x="0" y="228" width="480" height="112" rx="14" fill="#030712" fill-opacity="0.95" stroke="#1e293b" stroke-width="1" />
    <text x="24" y="252" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">-- SQL METRIC EXTRACTION QUERY</text>
    <text x="24" y="272" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">SELECT Vehicle_Type, COUNT(Booking_ID) AS Total_Rides,</text>
    <text x="24" y="290" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">ROUND(SUM(Booking_Value), 2) AS Total_Revenue</text>
    <text x="24" y="308" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="11">FROM ola_bookings WHERE Booking_Status = 'Success' GROUP BY 1;</text>
  </g>
</svg>
